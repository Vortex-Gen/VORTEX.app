name: Build Vortex Beta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'plugins/**'
      - 'assets/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle Network Resilience
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.http.retry=true
          EOF

      - name: Install Dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Standalone Release APK
        run: |
          cd android
          sed -i 's/android.enableJetifier=false/android.enableJetifier=true/g' gradle.properties
          grep -q "android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease


      - name: Upload Vortex Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Beta-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
